[package]
name = "boorstar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "개인 에이전트와 하네스를 관리하는 Rust 데스크톱 앱"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:eframe"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"

[[bin]]
name = "boorstar"
path = "src/main.rs"
required-features = ["desktop"]
